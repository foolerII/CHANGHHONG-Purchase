<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>长虹佳华采购管理平台｜预计返利管理原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <img class="brand" src="assets/logo.png" alt="长虹佳华" />
    <button class="menu-toggle" aria-label="收起导航">☰</button>
    <div class="crumb">采购管理平台 <span>/</span> 预计返利管理 <span>/</span> <b id="crumb-current">待关联返利合同</b></div>
    <div class="topbar-right">
      <label class="dev-switch" title="打开后显示角色切换、演示工具入口，以及字段级说明提示；关闭后即为上线形态">
        <input type="checkbox" id="dev-mode" checked /><span class="track"><span class="knob"></span></span>开发模式
      </label>
      <label class="dev-switch addon-switch" title="打开后编辑页出现 2026-09-10 增补需求的新关联方式；关闭即为改动前的基线原型，方便对比">
        <input type="checkbox" id="addon-mode" checked /><span class="track"><span class="knob"></span></span>场景优化（增补）
      </label>
      <select id="role-select" title="切换当前登录人的角色，用于演示权限差异"></select>
      <button id="tools-btn" class="prd-btn">演示工具</button>
      <button id="prd-btn" class="prd-btn">PRD 说明</button>
      <div class="user"><span class="bell">♧</span><img src="assets/avatar.png" alt="个人头像" /><span id="user-name">张茜彤</span><span>⌄</span></div>
    </div>
  </header>

  <aside class="sidebar">
    <nav>
      <button class="nav-group" id="nav-group" aria-expanded="true">
        <span class="nav-icon">￥</span><span class="nav-text">预计返利管理</span><span class="nav-arrow" id="nav-arrow">⌃</span>
      </button>
      <div class="nav-children" id="nav-children">
        <button class="nav-item active" data-page="pending">待关联返利合同</button>
        <button class="nav-item" data-page="linked">已关联返利合同</button>
        <button class="nav-item" data-page="details">已关联返利明细</button>
        <button class="nav-item" data-page="base">返利数据底表</button>
      </div>
    </nav>
  </aside>

  <main>
    <div id="view-list">
      <section class="filters card" id="filters"></section>
      <section class="card table-card">
        <div class="table-title" id="table-title"></div>
        <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
        <div class="pager">
          <span id="total"></span>
          <select><option>10条/页</option><option>20条/页</option></select>
          <button disabled>‹</button><button class="page-on">1</button><button>›</button>
          <span>前往</span><input value="1" /><span>页</span>
        </div>
      </section>
    </div>

    <div id="view-detail" hidden>
      <section class="card detail-card">
        <div class="detail-head">
          <div class="table-title" id="detail-title"></div>
          <div class="detail-head-right" id="detail-head-right"></div>
        </div>
        <div class="from-view" id="type-switch"></div>
        <div class="table-wrap"><table><thead id="detail-thead"></thead><tbody id="detail-tbody"></tbody></table></div>
        <div class="toolbar-line" id="detail-toolbar"></div>
        <div class="footer-btns" id="detail-footer"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close">×</button></div>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="drawer-mask" id="drawer-mask" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-resizer" id="drawer-resizer" title="拖动调整宽度，双击恢复默认"></div>
    <div class="drawer-head">
      <h2>PRD 说明</h2>
      <button id="drawer-close">×</button>
    </div>
    <div class="drawer-tabs" id="drawer-tabs"></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="hint-tip" id="hint-tip" hidden></div>

  <input type="file" id="file-input" accept=".xlsx" hidden />
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
